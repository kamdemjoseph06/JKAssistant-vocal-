name: Build & Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable
          cache: true

      - name: Préparer les dossiers assets
        run: mkdir -p assets/models assets/animations assets/fonts assets/sounds

      - name: Télécharger modèle Vosk FR
        run: |
          wget -q https://alphacephei.com/vosk/models/vosk-model-small-fr-0.22.zip \
            -O assets/models/vosk-model-small-fr-0.22.zip

      - name: Télécharger modèle Vosk EN
        run: |
          wget -q https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip \
            -O assets/models/vosk-model-small-en-us-0.15.zip

      - run: flutter pub get
      - run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Compiler les APK par architecture
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons --build-number "${{ github.run_number }}" --build-name "2.0.${{ github.run_number }}"

      - name: Nommer les APK
        id: apk_info
        run: |
          DATE=$(date +%Y%m%d-%H%M)
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          mkdir -p release-assets
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            SRC="build/app/outputs/flutter-apk/app-${ABI}-release.apk"
            DEST="release-assets/JKAssistant-vocal-${DATE}-${SHA}-${ABI}.apk"
            cp "${SRC}" "${DEST}"
          done
          echo "tag=v${DATE}-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Créer GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk_info.outputs.tag }}
          name: "JKAssistant Vocal — ${{ steps.apk_info.outputs.tag }}"
          body: |
            ## Installation Android

            Téléchargez la variante correspondant à votre appareil :

            - **arm64-v8a** : recommandé pour la plupart des téléphones Android récents.
            - **armeabi-v7a** : téléphones Android plus anciens en 32 bits.
            - **x86_64** : émulateurs et appareils Android Intel compatibles.

            Autorisez l’installation depuis GitHub ou votre gestionnaire de fichiers, puis accordez les permissions Microphone, Contacts et Téléphone.

            Cette release embarque les modèles Vosk sous le format attendu par l’application.
          files: release-assets/*.apk
          make_latest: true
